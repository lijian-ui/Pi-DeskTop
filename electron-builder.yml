appId: com.pi-desk.app
productName: Pi Desktop
directories:
  output: release
# node-pty is a native (N-API) module; .node binaries cannot be loaded from
# inside asar, so the whole package must be unpacked next to the archive.
asar: true
asarUnpack:
  - "node_modules/node-pty/**/*"
# node-pty ships prebuilt binaries (prebuilds/win32-x64/pty.node etc.) and is
# N-API (ABI-stable), so it does NOT need to be rebuilt for Electron.
# Without this, electron-builder runs @electron/rebuild → node-gyp → Python,
# which fails on Python 3.12+ (distutils removed from stdlib).
npmRebuild: false
files:
  - dist/**/*
  - resources/**/*
  - package.json
# electron-updater 更新源：Gitee Releases 固定 tag `latest`（generic provider）。
# 每次发版把 latest.yml + 安装包上传到该 release 附件，electron-updater 会请求
# {url}/latest.yml 获取元数据并下载新安装包。
publish:
  provider: generic
  url: https://gitee.com/rooky-top/pi-desk-top/releases/download/latest
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: resources/pi-logo.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb