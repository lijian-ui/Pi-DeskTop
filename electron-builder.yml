appId: com.pi-desk.app
productName: Pi Desktop
directories:
  output: release
# node-pty is a native (N-API) module; .node binaries cannot be loaded from
# inside asar, so the whole package must be unpacked next to the archive.
asar: true
asarUnpack:
  - "node_modules/node-pty/**/*"
  # better-sqlite3 ships a prebuilt N-API native binary (.node) that cannot be
  # loaded from inside asar; unpack the whole package so Electron resolves the
  # native addon at runtime. N-API is ABI-stable, so the npm-installed prebuild
  # loads in Electron 35 without a node-gyp rebuild (npmRebuild:false above).
  - "node_modules/better-sqlite3/**/*"
  # @ffmpeg-installer/ffmpeg ships a prebuilt ffmpeg binary (executable) inside
  # its platform sub-package (e.g. @ffmpeg-installer/win32-x64). The binary must
  # be unpacked outside the asar archive to be executable; unpack the whole
  # @ffmpeg-installer tree to keep the JS and binary co-located.
  - "node_modules/@ffmpeg-installer/**/*"
  # 页面脚本（resources/browser/snapshot-page.js）由主进程在运行时按路径读取后注入页面；
  # 解包到 asar 之外可确保它是磁盘上的真实文件。与 src/main/pi/browser/paths.ts 的
  # browserResourceDir() 保持一致。
  - "resources/browser/**/*"
# node-pty ships prebuilt binaries (prebuilds/win32-x64/pty.node etc.) and is
# N-API (ABI-stable), so it does NOT need to be rebuilt for Electron on Windows.
# We keep npmRebuild:false here so electron-builder never runs node-gyp (which
# fails on Python 3.12+ / machines without VS). macOS instead rebuilds node-pty
# against the bundled Electron via scripts/build-electron.mjs (see build:electron).
npmRebuild: false
files:
  - dist/**/*
  - resources/**/*
  - package.json
# electron-updater 更新源：Gitee Releases 固定 tag `latest`（generic provider）。
# 每次发版把 latest.yml + 安装包上传到该 release 附件，electron-updater 会请求
# {url}/latest.yml 获取元数据并下载新安装包。
publish:
  provider: generic
  url: https://gitee.com/rooky-top/pi-desk-top/releases/download/latest
mac:
  icon: resources/pi-logo.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # 按架构分别打包（Apple Silicon + Intel 各一个安装包）：
  #   node scripts/build-electron.mjs --mac --arm64 --x64
  # 脚本会对两个架构各重编一次 node-pty 并放入 prebuilds/（node-pty 运行时按
  # 机器架构自动选择），产出 *-arm64.dmg / *-x64.dmg；electron-updater 会按
  # 用户机器架构自动下载对应包。必须在 macOS 本机构建。
win:
  icon: resources/pi-logo.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb